#
# SlimeVR Butterfly Dongle (nRF52833): DTM over USB CDC ACM.
#
# Board-level settings (CONFIG_BUILD_OUTPUT_UF2, CONFIG_FLASH_LOAD_OFFSET=0x1000,
# USB stack) come from the board defconfig. The settings below are what the DTM
# sample needs on top of that.
#

CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# CDC ACM driver requires the interrupt-driven UART API.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# The sample never calls usb_enable(), and this board does not default
# USB_DEVICE_INITIALIZE_AT_BOOT to y.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# Same VID/PID as the SlimeVR receiver firmware.
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x7690
CONFIG_USB_DEVICE_PRODUCT="SlimeVR Butterfly Dongle DTM"

# Keep USB stack logging on RTT quiet.
CONFIG_USB_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USB_DEVICE_LOG_LEVEL_WRN=y

# Used by the DFU re-entry button in main.c (button input and sys_reboot()).
CONFIG_GPIO=y
CONFIG_REBOOT=y

# Keep the image inside the Adafruit UF2 application window (0x1000..0x6D000).
# The bootloader rejects UF2 blocks at or above 0x6D000.
CONFIG_FLASH_LOAD_SIZE=0x6C000

# Do NOT enable CONFIG_CONSOLE / CONFIG_UART_CONSOLE here: the board DTS selects
# the CDC ACM port as zephyr,console, so the log UART backend would write text
# into the DTM two-byte command stream. Logs stay on RTT (see prj.conf).
